name: Build Maro Pravas Hisab APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MaroPravasHisab_AndroidProject.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          test -f MaroPravasHisab_AndroidProject.zip
          mkdir -p buildsrc
          unzip -q MaroPravasHisab_AndroidProject.zip -d buildsrc

      - name: Build debug APK
        working-directory: buildsrc/MaroPravasHisab_AndroidProject
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maro-pravas-hisab-debug-apk
          path: buildsrc/MaroPravasHisab_AndroidProject/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
